name: Nightwell Windows Monitor Tests
on:
  push:
    paths:
      - 'admin-monitor/**'
      - '.github/workflows/admin-monitor-tests.yml'
  pull_request:
    paths:
      - 'admin-monitor/**'
      - '.github/workflows/admin-monitor-tests.yml'
permissions:
  contents: read
jobs:
  agent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r admin-monitor/requirements.txt
      - run: python -m unittest discover -s admin-monitor/tests -v
