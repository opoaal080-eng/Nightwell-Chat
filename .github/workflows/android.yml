name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Configure FCM for this build (optional)
        env:
          NIGHTWELL_FIREBASE_ANDROID_JSON: ${{ secrets.NIGHTWELL_FIREBASE_ANDROID_JSON }}
        run: |
          if [ -n "$NIGHTWELL_FIREBASE_ANDROID_JSON" ]; then
            printf '%s' "$NIGHTWELL_FIREBASE_ANDROID_JSON" > android/app/google-services.json
            echo "Firebase Android configuration provided."
          else
            echo "::warning::Firebase credentials not provided. APK builds, but background FCM notifications will remain inactive."
          fi
      - name: Build installable test APK
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp ios/NightwellChat/Assets.xcassets/AppIcon.appiconset/Icon.png android/app/src/main/res/drawable-nodpi/ic_launcher.png
          cd android
          gradle :app:assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NightwellChat-Android-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
