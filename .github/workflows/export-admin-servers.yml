name: Export Nightwell Server Sources
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-admin-servers.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export current server sources without secrets
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          roots = [Path("server"), Path("admin-monitor")]
          singles = [Path("Start_Nightwell_Chat.bat"), Path("Stop_Nightwell_Chat.bat"), Path("Caddyfile.example")]
          with ZipFile("Nightwell-Existing-Server-Sources.zip","w",ZIP_DEFLATED) as z:
              for root in roots:
                  for f in root.rglob("*"):
                      if f.is_file() and not any(x in f.parts for x in (".git",".venv","__pycache__","data")) and f.name != ".env":
                          z.write(f, f.as_posix())
              for f in singles:
                  if f.is_file(): z.write(f,f.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Nightwell-Existing-Server-Sources
          path: Nightwell-Existing-Server-Sources.zip
          if-no-files-found: error
