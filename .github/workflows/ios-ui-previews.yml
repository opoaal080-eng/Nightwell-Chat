name: iOS UI screenshots
on:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios-ui-previews.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: macos-26-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: cd ios && xcodegen generate
      - name: Build simulator app
        run: xcodebuild -project ios/NightwellChat.xcodeproj -scheme NightwellChat -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath simbuild CODE_SIGNING_ALLOWED=NO build > simulator-build.log 2>&1
      - name: Capture five screens
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for key,values in d["devices"].items() if "iOS" in key for x in values if x["name"].startswith("iPhone 16") or x["name"].startswith("iPhone 17")))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time '02:15' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 89
          xcrun simctl install "$DEVICE" simbuild/Build/Products/Debug-iphonesimulator/NightwellChat.app
          mkdir -p ui-screenshots
          for screen in chats contacts calls chat group; do
            xcrun simctl terminate "$DEVICE" fun.nightwell.chat || true
            xcrun simctl launch "$DEVICE" fun.nightwell.chat --reference-preview "$screen"
            sleep 4
            xcrun simctl io "$DEVICE" screenshot "ui-screenshots/$screen.png"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NightwellChat-UI-screenshots
          path: |
            ui-screenshots/*.png
            simulator-build.log
