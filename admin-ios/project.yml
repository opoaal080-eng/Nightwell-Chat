name: NightwellAdmin
options:
  bundleIdPrefix: fun.nightwell
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  NightwellAdmin:
    type: application
    platform: iOS
    sources:
      - path: NightwellAdmin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fun.nightwell.admin
        MARKETING_VERSION: '1.1.0'
        CURRENT_PROJECT_VERSION: '3'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nightwell Admin
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
