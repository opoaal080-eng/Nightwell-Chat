name: NightwellChat
options:
  bundleIdPrefix: fun.nightwell
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  NightwellChat:
    type: application
    platform: iOS
    sources:
      - path: NightwellChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fun.nightwell.chat
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: NightwellChat/Info.plist
      properties:
        CFBundleDisplayName: Nightwell Chat
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
