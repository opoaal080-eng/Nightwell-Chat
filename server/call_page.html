<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>Nightwell · Звонок</title><style>
:root{color-scheme:dark}body{background:#050505;color:#fff;font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center}.panel{width:min(90vw,440px);text-align:center;padding:26px;border:1px solid #333;border-radius:28px;background:#161616}h1{font-size:24px;font-weight:500;letter-spacing:.1em}p{color:#bbb;line-height:1.5}button{background:#fff;color:#000;border:0;border-radius:16px;padding:16px 20px;font-weight:700;font-size:16px;margin:10px;min-width:155px}button:disabled{opacity:.35}.danger{background:#363636;color:white}#state{min-height:45px}small{display:block;color:#888}audio{display:none}html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;overscroll-behavior:none}button{touch-action:manipulation}
.call-shell{width:min(94vw,460px);display:grid;gap:14px;padding:16px;box-sizing:border-box}.call-shell .panel{width:auto;margin:0;padding:24px;background:rgba(24,24,26,.97);border:1px solid #333;border-radius:28px}.call-status{min-height:330px;display:flex;flex-direction:column;justify-content:center;align-items:center}.brand{font-size:12px;font-weight:800;letter-spacing:.24em;color:#aaa}.orb{margin:34px auto 14px;width:118px;height:118px;border-radius:50%;background:radial-gradient(circle at 30% 22%,#666,#25252d 55%,#0e0e0f);box-shadow:0 0 0 12px #ffffff08,0 0 0 28px #ffffff06;animation:breathe 2.7s ease-in-out infinite}.call-status h1{font-size:27px;letter-spacing:0;margin:24px 0 0}.call-status #state{margin:10px 0;min-height:50px;font-size:15px}.controls{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.controls button{margin:0;flex:1 1 110px;min-width:0;min-height:58px;padding:11px 7px;font-size:14px;border-radius:19px;background:#353539;color:white}.controls button#hang{background:#e0444f;color:white}.controls button#mute{background:#343b46}.controls button#mute.muted{background:#435f86}.controls button#start{background:white;color:black}.controls button:disabled{opacity:.36}.call-shell small{text-align:center;font-size:12px}@keyframes breathe{50%{transform:scale(1.06);box-shadow:0 0 0 17px #ffffff0b,0 0 0 36px #ffffff05}}@media(prefers-reduced-motion:reduce){.orb{animation:none}}</style></head><body><div class="call-shell"><main class="panel call-status"><div class="brand">NIGHTWELL CHAT</div><div class="orb" aria-hidden="true"></div><h1>Голосовой звонок</h1><p id="state" role="status" aria-live="polite">Подготовка звонка</p></main><section class="panel controls" aria-label="Управление звонком"><button id="start">Включить микрофон</button><button id="mute" disabled>Выключить звук</button><button id="hang">Завершить</button></section><small>WebRTC · Разговор не записывается на сервере</small><audio id="remote" autoplay playsinline></audio></div>
<script>
'use strict';
window.NIGHTWELL_CALL_PAGE_VERSION='0.11.11';
const cid='__CALL_ID__';const fragment=new URLSearchParams(location.hash.substring(1));const ticket=fragment.get('ticket')||'';
const status=document.getElementById('state'),start=document.getElementById('start'),mute=document.getElementById('mute'),hang=document.getElementById('hang'),audio=document.getElementById('remote');
let pendingOffer=null,pendingIce=[];
let ws,peer,stream,role,ready=false,offered=false,finished=false,restarting=false,reconnectTimer=null,reconnectAttempts=0,muted=false,pollHandle=null,starting=false;
let connectionWatchdog=null,iceRestartCount=0,connectionError=false;
let signalingWatchdog=null,peerCreation=null,peerEpoch=0,localMicrophoneError=null,remoteMicrophoneError=false;
let hasTurnRelay=false;
function stopConnectionWatchdog(){if(connectionWatchdog){clearTimeout(connectionWatchdog);connectionWatchdog=null}}
function stopSignalingWatchdog(){if(signalingWatchdog){clearTimeout(signalingWatchdog);signalingWatchdog=null}}
function watchSignaling(){
 if(finished||ready||connectionError||signalingWatchdog)return;
 signalingWatchdog=setTimeout(()=>{
  signalingWatchdog=null;
  if(finished||ready||connectionError)return;
  connectionError=true;
  const msg='Собеседник не подключился к серверу звонков. Проверь интернет и DNS chat.nightwell.fun на другом телефоне.';
  text(msg);nativeEvent('call_error',msg,'SIGNALING_TIMEOUT');
 },20000);
}
function connectionFailed(){
 if(finished||connectionError)return;
 connectionError=true;stopConnectionWatchdog();
 const message=hasTurnRelay?'Не удалось соединить устройства. Проверь мобильную сеть и доступность TURN-сервера.':'Не удалось соединить устройства. Для звонков через мобильную сеть настрой TURN-сервер Nightwell Chat.';
 text(message);nativeEvent('call_error',message,'ICE_TIMEOUT');
}
function watchConnection(){
 stopConnectionWatchdog();
 if(finished||!peer||peer.connectionState==='connected')return;
 connectionWatchdog=setTimeout(()=>{
  if(finished||!peer||!ready||remoteMicrophoneError||peer.connectionState==='connected')return;
  if(role==='caller'&&iceRestartCount<1){void restartIce();return}
  connectionFailed();
 },role==='caller'?18000:35000);
}
function renderMute(){mute.textContent=muted?'Включить микрофон':'Выключить микрофон';mute.classList.toggle('muted',muted)}
function setMuted(value){if(!stream||finished)return false;muted=!!value;stream.getAudioTracks().forEach(track=>{track.enabled=!muted});renderMute();nativeEvent('mute',muted?'on':'off');return true}
window.setCallMuted=setMuted;
mute.onclick=()=>{if(setMuted(!muted))text(muted?'Микрофон выключен':'Микрофон включён')};
function nativeEvent(type,message='',code=''){try{window.webkit?.messageHandlers?.nightwellCall?.postMessage({type,message,code});}catch(e){}try{window.NightwellBridge?.postMessage(JSON.stringify({type,message,code}));}catch(e){}}
function text(msg){
 // Signaling can send duplicate peer_ready/media_ready notifications after ICE is connected.
 // Never overwrite a confirmed live call with a provisional setup label.
 if(peer&&peer.connectionState==='connected'&&[
  'Устанавливаем соединение…','Соединение…',
  'Микрофон активен. Соединяем…','Микрофон собеседника включён. Соединяем…',
  'Собеседник ответил. Ожидаем подключение его телефона…'
 ].includes(msg))return;
 if(status.textContent===msg)return;
 status.textContent=msg;nativeEvent('state',msg);
}
function resetPeer(){stopConnectionWatchdog();peerEpoch++;peerCreation=null;pendingOffer=null;pendingIce=[];if(peer){peer.onicecandidate=null;peer.ontrack=null;peer.onconnectionstatechange=null;peer.oniceconnectionstatechange=null;peer.close();peer=null}audio.srcObject=null;offered=false;restarting=false;iceRestartCount=0;connectionError=false}
function send(kind,data){if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:kind,data:data||null}))}
function closeCall(remote=false){
 if(finished)return;finished=true;
 if(reconnectTimer)clearTimeout(reconnectTimer);if(pollHandle)clearInterval(pollHandle);stopConnectionWatchdog();stopSignalingWatchdog();
 if(!remote){send('hangup');fetch('/calls/'+cid+'/hangup',{method:'POST',headers:{'Authorization':'Call '+ticket},keepalive:true}).catch(()=>{});}
 if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;resetPeer();if(ws)ws.close();
 start.disabled=true;mute.disabled=true;text('Звонок завершён');nativeEvent('ended',remote?'remote':'local');
}
window.closeCall=closeCall;
hang.onclick=()=>closeCall(false);
async function restartIce(){
 if(finished||!peer||!ready||restarting||connectionError)return;
 if(peer.signalingState!=='stable'){connectionFailed();return}
 if(role!=='caller'){text('Ожидаем восстановления связи…');return}
 if(iceRestartCount>=1){connectionFailed();return}
 restarting=true;iceRestartCount++;
 try{
  text('Восстанавливаем соединение…');
  const offer=await peer.createOffer({iceRestart:true});
  await peer.setLocalDescription(offer);
  send('offer',peer.localDescription);
  watchConnection();
 }catch(err){connectionFailed();console.warn('ICE restart failed',err)}
 finally{restarting=false}
}
window.restartIce=restartIce;
async function connect(){
 if(!ticket){text('Нет разрешения на звонок');start.disabled=true;return}
 const socket=new WebSocket(location.origin.replace(/^http/,'ws')+'/calls/'+cid+'/signal?ticket='+encodeURIComponent(ticket));
 ws=socket;
 ws.onclose=()=>{
  if(finished||ws!==socket)return;
  ready=false;stopSignalingWatchdog();
  resetPeer(); // Force fresh offer/answer on reconnect.
  text('Сигнальное соединение потеряно. Переподключаемся…');
  if(reconnectAttempts>=6){const msg='Не удалось подключиться к серверу звонков. Проверь DNS и интернет.';text(msg);nativeEvent('call_error',msg,'SIGNALING_DISCONNECTED');return}
  const delay=Math.min(1000*Math.pow(2,reconnectAttempts++),10000);
  reconnectTimer=setTimeout(connect,delay);
 };
 ws.onerror=()=>{if(!finished&&ws===socket)text('Не удалось подключиться к звонку')};
 ws.onmessage=async e=>{
  if(finished||ws!==socket)return;
  const msg=JSON.parse(e.data);
  try {
   if(msg.type==='connected'){role=msg.role;reconnectAttempts=0;text(role==='caller'?'Ожидание ответа…':'Соединение…');if(localMicrophoneError)send('media_error',{code:localMicrophoneError});return}
   if(msg.type==='peer_ready'){ready=true;connectionError=false;stopSignalingWatchdog();if(!peer||peer.connectionState!=='connected')await negotiate();return}
   if(msg.type==='peer_left'){ready=false;stopSignalingWatchdog();resetPeer();text('Собеседник отключился. Ожидаем возвращения…');return}
   if(msg.type==='ended'){closeCall(true);return}
   if(msg.type==='peer_media_error'){
    remoteMicrophoneError=true;stopConnectionWatchdog();
    text('У собеседника не запускается микрофон. Ожидаем, пока он исправит ошибку на телефоне.');return
   }
   if(msg.type==='peer_media_ready'){
    remoteMicrophoneError=false;connectionError=false;
    if(!peer||peer.connectionState!=='connected'){text('Микрофон собеседника включён. Соединяем…');await negotiate()}return
   }
   if(msg.type==='offer'){if(!stream){pendingOffer=msg.data;text('Готовим микрофон для ответа…');return}await answerOffer(msg.data);return}
   if(msg.type==='answer' && peer){await peer.setRemoteDescription(msg.data);await flushIce();return}
   if(msg.type==='ice' && msg.data){if(!peer||!peer.remoteDescription){if(pendingIce.length<256)pendingIce.push(msg.data)}else{await peer.addIceCandidate(msg.data)}}
  } catch(err){const message='Ошибка WebRTC: '+err.message;text(message);nativeEvent('call_error',message,'WEBRTC_ERROR')}
 }
}
async function flushIce(){const candidates=pendingIce;pendingIce=[];for(const candidate of candidates){try{await peer.addIceCandidate(candidate)}catch(err){console.warn('ICE not accepted')}}}
async function answerOffer(offer){await ensurePeer();await peer.setRemoteDescription(offer);await flushIce();const answer=await peer.createAnswer();await peer.setLocalDescription(answer);send('answer',peer.localDescription);watchConnection()}
async function ensurePeer(){
 if(peer)return peer;
 if(peerCreation)return peerCreation;
 const epoch=peerEpoch;
 // Share one asynchronous creation among concurrent WebSocket messages.
 const task=(async()=>{
  const response=await fetch('/calls/'+cid+'/ice',{headers:{'Authorization':'Call '+ticket},cache:'no-store'});
  if(!response.ok)throw new Error('Не удалось получить настройки аудио, HTTP '+response.status);
  const cfg=await response.json();
  if(epoch!==peerEpoch||finished)throw new Error('Соединение было сброшено');
  if(!Array.isArray(cfg.iceServers)||!cfg.iceServers.length)throw new Error('Нет настроек ICE на сервере');
  hasTurnRelay=cfg.iceServers.some(item=>[item.urls].flat().some(url=>String(url).startsWith('turn:')||String(url).startsWith('turns:')));
  const pc=new RTCPeerConnection(cfg);peer=pc;
  pc.onicecandidate=e=>{if(e.candidate)send('ice',e.candidate.toJSON())};
  pc.ontrack=e=>{audio.srcObject=e.streams[0]||new MediaStream([e.track]);audio.play().catch(()=>text('Нажми экран, чтобы включить звук'))};
  pc.onconnectionstatechange=()=>{
   if(pc!==peer)return;
   if(pc.connectionState==='connected'){stopConnectionWatchdog();stopSignalingWatchdog();iceRestartCount=0;connectionError=false;remoteMicrophoneError=false;text('Разговор')}
   if(pc.connectionState==='disconnected'){text('Связь прервана, ждём восстановления…');watchConnection()}
   if(pc.connectionState==='failed'){text('Пробуем восстановить звонок…');void restartIce()}
  };
  pc.oniceconnectionstatechange=()=>{
   if(pc===peer&&pc.iceConnectionState==='failed'&&!connectionError){void restartIce()}
  };
  if(stream)stream.getTracks().forEach(track=>pc.addTrack(track,stream));
  return pc;
 })();
 peerCreation=task;
 try{return await task}finally{if(peerCreation===task)peerCreation=null}
}
async function negotiate(){
 if(finished||!stream||!ready||remoteMicrophoneError)return;
 await ensurePeer();
 // An existing connected RTCPeerConnection needs no additional setup UI or watchdog.
 if(!peer||peer.connectionState==='connected')return;
 if(role==='caller'&&!offered){
  offered=true;
  try{
   const offer=await peer.createOffer();
   await peer.setLocalDescription(offer);
   send('offer',peer.localDescription);
   watchConnection();
  }catch(err){offered=false;connectionFailed();console.warn('Offer failed',err)}
 }else if(peer.connectionState!=='connected'){
  if(!connectionError)text('Устанавливаем соединение…');
  watchConnection();
 }
}
function microphoneErrorMessage(err){
 const name=err&&err.name||'UnknownError';
 if(name==='NotAllowedError'||name==='PermissionDeniedError'||name==='SecurityError')
  return 'Нет доступа к микрофону. Разреши его в настройках Nightwell Chat.';
 if(name==='NotFoundError'||name==='DevicesNotFoundError')
  return 'Микрофон не найден. Проверь устройство записи и разрешение на доступ к нему.';
 if(name==='NotReadableError'||name==='TrackStartError'||name==='AbortError'||
    String(err&&err.message||'').includes('Could not start audio source'))
  return /Android/i.test(navigator.userAgent)
   ? 'Не удалось включить микрофон телефона. Проверь разрешение для Nightwell Chat, закрой другие звонки и нажми «Повторить».'
   : 'Микрофон занят или недоступен. Проверь устройство ввода и нажми «Повторить».';
 if(name==='OverconstrainedError')
  return 'Микрофон не поддерживает параметры записи. Попробуй другое устройство ввода.';
 return 'Ошибка микрофона ('+name+'): '+String(err&&err.message||'неизвестная причина');
}
async function startAudio(){
 if(starting||stream||finished)return false;
 starting=true;
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
  starting=false;
  const message='Этот WebView не поддерживает захват микрофона.';
  localMicrophoneError='UnsupportedError';send('media_error',{code:localMicrophoneError});
  text(message);nativeEvent('microphone_error',message,'UnsupportedError');
  return false;
 }
 start.disabled=true;
 try{
  let acquired;
  try{
   acquired=await navigator.mediaDevices.getUserMedia({
    audio:{echoCancellation:true,noiseSuppression:true},video:false
   });
  }catch(firstError){
   // Fall back to default input on devices that reject processing constraints.
   if(!['OverconstrainedError','NotReadableError','AbortError'].includes(firstError.name))throw firstError;
   await new Promise(resolve=>setTimeout(resolve,250));
   acquired=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
  }
  if(finished){acquired.getTracks().forEach(t=>t.stop());return false}
  stream=acquired;
  mute.disabled=false;muted=false;renderMute();
  localMicrophoneError=null;send('media_ready');
  nativeEvent('microphone_ready','Микрофон включён');
  text('Микрофон активен. Соединяем…');
  try {
   if(pendingOffer){const offer=pendingOffer;pendingOffer=null;await answerOffer(offer)}
   else await negotiate();
  }catch(err){
   // Report network/ICE failure as a network problem, not as a microphone problem.
   const msg='Ошибка WebRTC: '+String(err&&err.message||'соединение недоступно');
   text(msg);nativeEvent('call_error',msg,'WEBRTC_SETUP');
  }
  return true;
 }catch(err){
  if(!finished){
   if(stream){stream.getTracks().forEach(track=>track.stop());stream=null}
   resetPeer();
   start.disabled=false;mute.disabled=true;
   const message=microphoneErrorMessage(err);
   localMicrophoneError=err&&err.name||'UnknownError';send('media_error',{code:localMicrophoneError});
   text(message);
   nativeEvent('microphone_error',message,localMicrophoneError);
  }
  return false;
 }finally{starting=false}
}
window.startCallAudio=startAudio;
start.onclick=startAudio;
window.addEventListener('pagehide',()=>{if(stream)stream.getTracks().forEach(t=>t.stop());resetPeer();if(ws)ws.close()});
async function pollCallStatus(){
 if(finished||!ticket)return;
 try{const response=await fetch('/calls/'+cid+'/status',{headers:{'Authorization':'Call '+ticket},cache:'no-store'});
 if(!response.ok){if(response.status===401||response.status===404||response.status===410)closeCall(true);return}
 const data=await response.json();if(data.status==='ended'||data.status==='declined')closeCall(true);
 else if(data.status==='active'&&!ready&&!connectionError){watchSignaling();if(role==='caller'&&!remoteMicrophoneError)text('Собеседник ответил. Ожидаем подключение его телефона…')}
 }catch(err){}
}
connect();pollHandle=setInterval(pollCallStatus,3000);pollCallStatus();
</script></body></html>
