<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>Nightwell · Звонок</title><style>
:root{color-scheme:dark}body{background:#050505;color:#fff;font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center}.panel{width:min(90vw,440px);text-align:center;padding:26px;border:1px solid #333;border-radius:28px;background:#161616}h1{font-size:24px;font-weight:500;letter-spacing:.1em}p{color:#bbb;line-height:1.5}button{background:#fff;color:#000;border:0;border-radius:16px;padding:16px 20px;font-weight:700;font-size:16px;margin:10px;min-width:155px}button:disabled{opacity:.35}.danger{background:#363636;color:white}#state{min-height:45px}small{display:block;color:#888}audio{display:none}
.call-shell{width:min(94vw,460px);display:grid;gap:14px;padding:16px;box-sizing:border-box}.call-shell .panel{width:auto;margin:0;padding:24px;background:rgba(24,24,26,.97);border:1px solid #333;border-radius:28px}.call-status{min-height:330px;display:flex;flex-direction:column;justify-content:center;align-items:center}.brand{font-size:12px;font-weight:800;letter-spacing:.24em;color:#aaa}.orb{margin:34px auto 14px;width:118px;height:118px;border-radius:50%;background:radial-gradient(circle at 30% 22%,#666,#25252d 55%,#0e0e0f);box-shadow:0 0 0 12px #ffffff08,0 0 0 28px #ffffff06;animation:breathe 2.7s ease-in-out infinite}.call-status h1{font-size:27px;letter-spacing:0;margin:24px 0 0}.call-status #state{margin:10px 0;min-height:50px;font-size:15px}.controls{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.controls button{margin:0;flex:1 1 110px;min-width:0;min-height:58px;padding:11px 7px;font-size:14px;border-radius:19px;background:#353539;color:white}.controls button#hang{background:#e0444f;color:white}.controls button#mute{background:#343b46}.controls button#mute.muted{background:#435f86}.controls button#start{background:white;color:black}.controls button:disabled{opacity:.36}.call-shell small{text-align:center;font-size:12px}@keyframes breathe{50%{transform:scale(1.06);box-shadow:0 0 0 17px #ffffff0b,0 0 0 36px #ffffff05}}@media(prefers-reduced-motion:reduce){.orb{animation:none}}</style></head><body><div class="call-shell"><main class="panel call-status"><div class="brand">NIGHTWELL CHAT</div><div class="orb" aria-hidden="true"></div><h1>Голосовой звонок</h1><p id="state" role="status" aria-live="polite">Подготовка звонка</p></main><section class="panel controls" aria-label="Управление звонком"><button id="start">Включить микрофон</button><button id="mute" disabled>Выключить звук</button><button id="hang">Завершить</button></section><small>WebRTC · Разговор не записывается на сервере</small><audio id="remote" autoplay playsinline></audio></div>
<script>
'use strict';
const cid='__CALL_ID__';const fragment=new URLSearchParams(location.hash.substring(1));const ticket=fragment.get('ticket')||'';
const status=document.getElementById('state'),start=document.getElementById('start'),mute=document.getElementById('mute'),hang=document.getElementById('hang'),audio=document.getElementById('remote');
let pendingOffer=null,pendingIce=[];
let ws,peer,stream,role,ready=false,offered=false,finished=false,restarting=false,reconnectTimer=null,reconnectAttempts=0,muted=false;
function renderMute(){mute.textContent=muted?'Включить микрофон':'Выключить микрофон';mute.classList.toggle('muted',muted)}
mute.onclick=()=>{if(!stream||finished)return;muted=!muted;stream.getAudioTracks().forEach(track=>{track.enabled=!muted});renderMute();text(muted?'Микрофон выключен':'Микрофон включён')};
function text(msg){status.textContent=msg}
function resetPeer(){pendingOffer=null;pendingIce=[];if(peer){peer.onicecandidate=null;peer.ontrack=null;peer.onconnectionstatechange=null;peer.close();peer=null}audio.srcObject=null;offered=false;restarting=false}
function send(kind,data){if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:kind,data:data||null}))}
function closeCall(){finished=true;if(reconnectTimer)clearTimeout(reconnectTimer);send('hangup');if(stream)stream.getTracks().forEach(t=>t.stop());resetPeer();if(ws)ws.close();start.disabled=true;mute.disabled=true;text('Звонок завершён')}
hang.onclick=closeCall;
async function restartIce(){
 if(finished||!peer||!ready||restarting)return;
 if(peer.signalingState!=='stable')return;
 if(role!=='caller'){text('Ожидаем восстановления связи…');return}
 restarting=true;
 try{
  text('Восстанавливаем соединение…');
  const offer=await peer.createOffer({iceRestart:true});
  await peer.setLocalDescription(offer);
  send('offer',peer.localDescription);
 }catch(err){text('Не удалось восстановить звонок: '+err.message)}
 finally{restarting=false}
}
window.restartIce=restartIce;
async function connect(){
 if(!ticket){text('Нет разрешения на звонок');start.disabled=true;return}
 const socket=new WebSocket(location.origin.replace(/^http/,'ws')+'/calls/'+cid+'/signal?ticket='+encodeURIComponent(ticket));
 ws=socket;
 ws.onclose=()=>{
  if(finished||ws!==socket)return;
  ready=false;
  text('Сигнальное соединение потеряно. Переподключаемся…');
  if(reconnectAttempts>=6){text('Не удалось восстановить связь. Попробуй позвонить снова');return}
  const delay=Math.min(1000*Math.pow(2,reconnectAttempts++),10000);
  reconnectTimer=setTimeout(connect,delay);
 };
 ws.onerror=()=>{if(!finished&&ws===socket)text('Не удалось подключиться к звонку')};
 ws.onmessage=async e=>{
  if(finished||ws!==socket)return;
  const msg=JSON.parse(e.data);
  try {
   if(msg.type==='connected'){role=msg.role;reconnectAttempts=0;text(role==='caller'?'Ожидание ответа…':'Соединение…');return}
   if(msg.type==='peer_ready'){ready=true;if(peer&&peer.connectionState==='failed')await restartIce();else await negotiate();return}
   if(msg.type==='peer_left'){ready=false;resetPeer();text('Собеседник отключился. Ожидаем возвращения…');return}
   if(msg.type==='ended'){closeCall();return}
   if(msg.type==='offer'){if(!stream){pendingOffer=msg.data;text('Нажми «Включить микрофон», чтобы ответить');return}await answerOffer(msg.data);return}
   if(msg.type==='answer' && peer){await peer.setRemoteDescription(msg.data);await flushIce();return}
   if(msg.type==='ice' && msg.data){if(!peer||!peer.remoteDescription){if(pendingIce.length<256)pendingIce.push(msg.data)}else{await peer.addIceCandidate(msg.data)}}
  } catch(err){text('Ошибка WebRTC: '+err.message)}
 }
}
async function flushIce(){const candidates=pendingIce;pendingIce=[];for(const candidate of candidates){try{await peer.addIceCandidate(candidate)}catch(err){console.warn('ICE not accepted')}}}
async function answerOffer(offer){await ensurePeer();await peer.setRemoteDescription(offer);await flushIce();const answer=await peer.createAnswer();await peer.setLocalDescription(answer);send('answer',peer.localDescription)}
async function ensurePeer(){
 if(peer)return;
 const cfg={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};
 // Optional TURN relay: injected by the server only when configured.
 if(window.NIGHTWELL_ICE_SERVERS&&Array.isArray(window.NIGHTWELL_ICE_SERVERS)){
  cfg.iceServers=window.NIGHTWELL_ICE_SERVERS;
 }
 peer=new RTCPeerConnection(cfg);
 peer.onicecandidate=e=>{if(e.candidate)send('ice',e.candidate.toJSON())};
 peer.ontrack=e=>{audio.srcObject=e.streams[0];audio.play().catch(()=>text('Нажми экран, чтобы включить звук'))};
 peer.onconnectionstatechange=()=>{
  if(peer.connectionState==='connected')text('Разговор');
  if(peer.connectionState==='disconnected')text('Связь прервана, ждём восстановления…');
  if(peer.connectionState==='failed'){text('Пробуем восстановить звонок…');restartIce()}
};
 if(stream)stream.getTracks().forEach(track=>peer.addTrack(track,stream));
}
async function negotiate(){if(finished||!stream||!ready)return;await ensurePeer();if(role==='caller'&&!offered){offered=true;const offer=await peer.createOffer();await peer.setLocalDescription(offer);send('offer',peer.localDescription)}else{text('Устанавливаем соединение…')}}
start.onclick=async()=>{
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){text('Микрофон недоступен в этом браузере');return}
 start.disabled=true;try{const acquired=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:false});if(finished){acquired.getTracks().forEach(t=>t.stop());return}stream=acquired;mute.disabled=false;muted=false;renderMute();text('Микрофон активен. Соединяем…');if(pendingOffer){const offer=pendingOffer;pendingOffer=null;await answerOffer(offer)}else{await negotiate()}}catch(err){if(!finished){start.disabled=false;text('Разреши доступ к микрофону: '+err.message)}}
};
window.addEventListener('pagehide',()=>{if(stream)stream.getTracks().forEach(t=>t.stop());resetPeer();if(ws)ws.close()});
connect();
</script></body></html>
