<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nightwell Chat">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="/chat-icon.svg">
<title>Nightwell Chat</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{background:#080808;color:white;margin:0;min-height:100dvh}
main{max-width:600px;margin:0 auto;padding:20px 14px calc(25px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.mark{background:#212121;border:1px solid #505050;border-radius:17px;padding:13px;font-size:25px}
h1{font-size:22px;margin:0}h2{font-size:18px;margin:0 0 15px}
.small{color:#a4a4a4;font-size:12px}.card{padding:18px;margin:12px 0;border:1px solid #343434;
background:linear-gradient(135deg,#1f1f1f,#111);border-radius:23px}
input,button{font:inherit}input{background:#080808;border:1px solid #444;color:white;padding:13px;
border-radius:12px;width:100%;margin:5px 0 10px}
button{border:1px solid #555;background:#262626;color:white;padding:11px 13px;border-radius:12px;cursor:pointer}
button.primary{background:#ebebeb;color:#080808;font-weight:700;border:0}
button:disabled{opacity:.4}.row{display:flex;align-items:center;gap:8px}.row>*{min-width:0}.grow{flex:1}
#messages{min-height:30vh;max-height:52vh;overflow:auto;margin-bottom:10px}
.bubble{background:#242424;border-radius:16px;padding:11px 13px;margin:8px 0;overflow-wrap:anywhere}
.mine{background:#3c3c3c}.hide{display:none!important}.chatItem{display:block;width:100%;text-align:left;margin:8px 0}
.notice{color:#c8c8c8;min-height:18px;font-size:13px;margin:10px 0}
</style></head><body><main>
<header><div class="mark">◐</div><div><h1>NIGHTWELL</h1><span class="small">CHAT · WEB PUSH</span></div>
<button id="logout" class="hide" style="margin-left:auto">Выйти</button></header>
<div class="notice" id="status"></div>
<section id="auth" class="card"><h2>Вход</h2>
<input id="identity" autocomplete="username" placeholder="Номер +7… или логин">
<input id="password" type="password" autocomplete="current-password" placeholder="Пароль">
<button class="primary" id="login">Войти</button>
<p class="small">Для регистрации нового пользователя по номеру нужна обновлённая версия сервера.</p></section>
<section id="home" class="hide">
<div class="card"><h2>Уведомления</h2>
<p class="small">На iPhone открой страницу в Safari, добавь её на экран «Домой», а затем разреши уведомления внутри установленного приложения.</p>
<button class="primary" id="enablePush">Включить уведомления</button><p id="pushState" class="small"></p></div>
<div class="card"><div class="row"><h2 class="grow">Чаты</h2><button id="refresh">Обновить</button></div>
<div id="chats"></div></div>
<div class="card hide" id="conversation"><div class="row"><h2 class="grow" id="chatTitle">Переписка</h2><button id="back">Закрыть</button></div>
<div id="messages" aria-live="polite"></div>
<form id="compose" class="row"><input class="grow" id="message" maxlength="4000" placeholder="Сообщение">
<button class="primary" type="submit">➤</button></form></div>
</section></main><script src="/chat-web.js" defer></script></body></html>
